name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install MetaTrader5 numpy pandas pyarrow tzdata pytest
      - run: python -m pytest audit/tests research -q
